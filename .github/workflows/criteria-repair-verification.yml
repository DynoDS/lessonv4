name: Criteria repair verification
on:
  push:
    branches: [repair/teachable-criteria-and-progression]
permissions:
  contents: read
jobs:
  integration-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 768a76f3bb08507fb6977a59c1680f9b0d9a125c
          fetch-depth: 2
          persist-credentials: false
      - name: Capture exact concurrent commit
        run: |
          git diff 3e728d0c42f3377eebbc04c0fa35ee6fbd9f3d12 HEAD --binary > /tmp/concurrent-main.patch
          git show --format=fuller --stat HEAD > /tmp/concurrent-main-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: concurrent-main-integration
          path: |
            /tmp/concurrent-main.patch
            /tmp/concurrent-main-summary.txt
          retention-days: 1
