name: Criteria repair verification
on:
  push:
    branches: [repair/teachable-criteria-and-progression]
permissions:
  contents: write
jobs:
  integrated-verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate the exact concurrent main commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin 768a76f3bb08507fb6977a59c1680f9b0d9a125c --depth=20
          python - <<'PY'
          from pathlib import Path
          import subprocess
          theirs = '768a76f3bb08507fb6977a59c1680f9b0d9a125c'
          path = 'plugins/lesson-v4/references/build-review-log.md'
          def show(ref, name):
              return subprocess.check_output(['git', 'show', f'{ref}:{name}'], text=True)
          ourslog = show('HEAD', path)
          theirlog = show(theirs, path)
          merged = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', theirs])
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          assert merged.returncode in (0, 1), merged.returncode
          assert conflicts in ([], [path]), conflicts
          header = '# Build review log\n\n'
          assert ourslog.startswith(header) and theirlog.startswith(header)
          section = ourslog[len(header):].split('## 2026-09-08 Criteria wording,')[0]
          section = section.replace('(4.2.111)', '(4.2.112)', 1)
          section = section.replace('No extra agent, required per-beat form or automatic Apply slide was added.', 'The concurrent 4.2.111 release and its existing `unlocks` field are preserved; this repair uses that line and the actual teaching rather than adding a second per-beat report, an extra agent or an automatic Apply slide.')
          section = section.replace('Verification: 205 targeted Python tests passed', 'Verification before integration with concurrent 4.2.111: 205 targeted Python tests passed')
          Path(path).write_text(header + section + theirlog[len(header):])
          root = Path('plugins/lesson-v4')
          for name in ('.claude-plugin/plugin.json', '.codex-plugin/plugin.json'):
              p = root / name
              text = p.read_text()
              assert text.count('"version": "4.2.111"') == 1
              p.write_text(text.replace('"version": "4.2.111"', '"version": "4.2.112"'))
          p = root / 'agents/lesson-designer.md'
          text = p.read_text()
          old = 'Use the existing content and expected answers; do not add per-beat reporting fields.'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'Use the existing `unlocks` line, content and expected answers; do not add another per-beat report.'))
          p = root / 'references/preferences.md'
          text = p.read_text()
          old = 'This is a design and review judgement using the existing content, not another per-beat form, written artefact or progress banner.'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'This is a design and review judgement using the existing `unlocks` line and actual content, not another per-beat form, written artefact or progress banner.'))
          subprocess.run(['git', 'add', 'plugins/lesson-v4'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          actual = subprocess.check_output(['git', 'rev-parse', f'{tree}:plugins/lesson-v4'], text=True).strip()
          assert actual == '0e718c734f86343462c973351ab57ee2194d9f7d', actual
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Exact integrated plugin tree verified:', actual)
          PY
      - name: Install test dependencies
        run: |
          python -m pip install pytest Pillow
          npm ci --prefix plugins/lesson-v4/builder
      - name: Run all affected Python contracts and concurrent explanation regressions
        working-directory: plugins/lesson-v4
        run: python -m pytest -q scripts/tests/test_success_criteria_fit_a_glance.py scripts/tests/test_drawlive_handoff.py scripts/tests/test_bounded_attempt_and_taught_invariants.py scripts/tests/test_design_review_packet.py scripts/tests/test_lesson_design_contract.py scripts/tests/test_verdict_leaks_spoken_notes_and_retest_decay.py scripts/tests/test_an_explanation_gets_used_not_restated.py
      - name: Run complete steps and criteria-panel regressions
        working-directory: plugins/lesson-v4/builder
        run: node --test test/steps.test.js test/success-criteria-panel.test.js
      - name: Commit verified integration on repair branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/repair/teachable-criteria-and-progression'
          tree="$(git write-tree)"
          test "$(git rev-parse "$tree:plugins/lesson-v4")" = '0e718c734f86343462c973351ab57ee2194d9f7d'
          git diff --cached --check
          git commit -m 'Integrate memorable criteria repair with concurrent learning progression release (4.2.112)'
          git push origin HEAD:refs/heads/repair/teachable-criteria-and-progression
