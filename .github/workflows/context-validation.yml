name: Verify and publish reviewed context refactor to work
on:
  push:
    branches: [context-validation-45d8a7e]
permissions:
  contents: write
jobs:
  publish-reviewed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: proposal
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: work
          path: implementation
      - name: Require unchanged target and reconstruct tested candidate
        working-directory: implementation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "45d8a7ede51bd7d372777258e42be017f6877e9c"
          test -z "$(git status --porcelain)"
          python3 -X utf8 ../proposal/.context-refactor/apply.py "$PWD"
      - name: Run reader, loading and conditional-context tests
        working-directory: implementation
        run: |
          set -euo pipefail
          mkdir -p /tmp/context-publication
          python3 -m unittest discover -s plugins/lesson-v4/scripts/tests -p test_read_reference.py -v > /tmp/context-publication/reader.txt 2>&1
          python3 -m unittest discover -s plugins/lesson-v4/scripts/tests -p test_lesson_designer_loading_guard.py -v > /tmp/context-publication/loading.txt 2>&1
          python3 -m unittest discover -s plugins/lesson-v4/scripts/tests -p test_lesson_designer_component_loading.py -v > /tmp/context-publication/components.txt 2>&1
          python3 plugins/lesson-v4/scripts/verify-plugin-root.py "$PWD/plugins/lesson-v4" > /tmp/context-publication/plugin-root.txt
          git diff --check
      - name: Verify exact files and push only work without force
        working-directory: implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          manifest=json.loads(pathlib.Path('../proposal/.context-refactor/expected.json').read_text())
          paths=sorted(manifest['sha256'])
          for name,digest in manifest['sha256'].items():
              actual=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if actual!=digest:
                  raise SystemExit('TESTED_FILE_CHANGED: '+name)
          subprocess.run(['git','add','--',*paths],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if staged!=set(paths):
              raise SystemExit('UNEXPECTED_STAGED_SCOPE')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('EXACT_TESTED_SCOPE_OK:',len(paths),'files')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Load Lesson Designer component detail conditionally, preserving teaching rules" -m "Move 22,335 bytes of intact component guidance behind prospective reading triggers using the existing section reader. Preserve core eligibility, teacher voice, review, model settings and contract authority. Update location-dependent tests, add 26 component/loading tests, and record baseline comparisons and measured context limits. No release, installation or main-branch changes."
          git push origin HEAD:refs/heads/work
          git rev-parse HEAD > /tmp/context-publication/published-commit.txt
          echo "WORK_PUBLISHED: $(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-context-publication
          path: /tmp/context-publication/
          retention-days: 1
          if-no-files-found: warn
