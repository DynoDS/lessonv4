name: Verify and publish consolidation to work
on:
  push:
    branches: [context-validation-45d8a7e]
    paths: [.github/workflows/publish-context-wave3.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: proposal
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: work
          path: implementation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require pinned work and reconstruct exact tested bytes
        working-directory: implementation
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          proposal=pathlib.Path('../proposal/.context-wave3')
          m=json.loads((proposal/'manifest.json').read_text())
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==m['baseCommit'], 'work advanced; refusing overwrite'
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip(), 'checkout not clean'
          encoded=''.join((proposal/f'patch-{i:02}.b64').read_text().strip() for i in range(1,5))
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()==m['patchSha256'], 'patch transport mismatch'
          subprocess.run(['git','apply','--check','--index','--unidiff-zero','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','-'],input=patch,check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==set(m['after']), 'unexpected changed paths'
          for rel,digest in m['after'].items():
              assert hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest()==digest, rel
          print('TESTED_CANDIDATE_BYTES_OK: 17 files')
          PY
          git diff --cached --check
      - name: Install test dependencies
        working-directory: implementation
        run: |
          mkdir -p /tmp/wave3-receipts
          python -m pip install 'pytest==9.0.2' pytest-subtests
          npm ci --prefix plugins/lesson-v4/builder
      - name: Record dependency audit without changing dependency versions
        working-directory: implementation
        run: |
          python - <<'PY'
          import pathlib,subprocess
          result=subprocess.run(['npm','audit','--prefix','plugins/lesson-v4/builder','--json'],capture_output=True)
          out=pathlib.Path('/tmp/wave3-receipts')
          (out/'dependency-audit.json').write_bytes(result.stdout)
          (out/'dependency-audit.stderr.txt').write_bytes(result.stderr)
          (out/'dependency-audit-exit.txt').write_text(str(result.returncode)+'\n')
          print('Dependency audit exit:',result.returncode,'; report retained separately from test results; no automatic upgrade applied')
          PY
      - name: Validate protected planning, loading, settings and runtime boundaries
        working-directory: implementation
        run: |
          python -m pytest -q --tb=short \
            plugins/lesson-v4/scripts/tests/test_planning_consolidation.py \
            plugins/lesson-v4/scripts/tests/test_rhythm_holds_in_every_route.py \
            plugins/lesson-v4/scripts/tests/test_an_idea_is_met_on_changing_evidence.py \
            plugins/lesson-v4/scripts/tests/test_make_lesson_static_contract.py \
            plugins/lesson-v4/scripts/tests/test_make_lesson_runtime.py \
            plugins/lesson-v4/scripts/tests/test_teacher_voice_reach.py \
            plugins/lesson-v4/scripts/tests/test_lesson_designer_component_loading.py \
            plugins/lesson-v4/scripts/tests/test_read_reference.py \
            plugins/lesson-v4/scripts/tests/test_worker_launch.py \
            | tee /tmp/wave3-receipts/python.txt
          python plugins/lesson-v4/scripts/verify-plugin-root.py "${PWD}/plugins/lesson-v4"
      - name: Run complete builder checks and worksheet control
        working-directory: implementation
        run: |
          npm run check --prefix plugins/lesson-v4/builder | tee /tmp/wave3-receipts/builder.txt
          node --test plugins/lesson-v4/worksheet-html/test/photo-costing.test.js | tee /tmp/wave3-receipts/worksheet-control.txt
      - name: Read back tested files and publish only work without force
        working-directory: implementation
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          m=json.loads(pathlib.Path('../proposal/.context-wave3/manifest.json').read_text())
          for rel,digest in m['after'].items():
              assert hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest()==digest, rel
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip(), 'tests changed tracked source'
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(m['after'])
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/work'],text=True).split()[0]
          assert remote==m['baseCommit'], 'work advanced during checks; refusing push'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Consolidate lesson planning and repair verified publication guards\n\nKeep models, pedagogy contracts and independent review unchanged.\nReject missing required images at final publication while preserving private\ncomposition previews, optional omission and the previous delivered deck.\n\nLocal final checks: 1503 Python tests, 1753 subtests, 588 builder tests and\n5 worksheet controls passed. Live lesson/usage comparison not available;\nthis work-branch change is not a release.'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/work'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          actual=subprocess.check_output(['git','ls-remote','origin','refs/heads/work'],text=True).split()[0]
          assert actual==sha, 'work read-back mismatch'
          pathlib.Path('/tmp/wave3-receipts/published.txt').write_text('WORK_PUBLISHED: '+sha+'\n')
          print('WORK_PUBLISHED:',sha)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-publication-receipts
          path: /tmp/wave3-receipts/
          retention-days: 1
